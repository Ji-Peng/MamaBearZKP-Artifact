# The x86-only profiling/size bins import AVX-512 MamaBear types and so do not
# build on other architectures. `cargo bench` / `cargo test` compile all bins
# by default, which would break every `--bench` / `--test` invocation there;
# mark them `bench = false, test = false` so only an explicit
# `cargo run --bin NAME` (x86) builds them.

# `bench_config` is the exception to the note above: it touches no arch-gated
# prover module (it only reads `util::params` constants), so it builds for real
# on any architecture.
[[bin]]
name = "bench_config"
path = "src/bin/bench_config.rs"
bench = false
test = false

[[bin]]
name = "circuit_size"
path = "src/bin/circuit_size.rs"
bench = false
test = false

[[bin]]
name = "peak_memory"
path = "src/bin/peak_memory.rs"
bench = false
test = false

[[bin]]
name = "profile_hp_df_goldilocks"
path = "src/bin/profile_hp_df_goldilocks.rs"
bench = false
test = false

[[bin]]
name = "profile_hp_df_mamabear"
path = "src/bin/profile_hp_df_mamabear.rs"
bench = false
test = false

[[bin]]
name = "proof_size"
path = "src/bin/proof_size.rs"
bench = false
test = false

